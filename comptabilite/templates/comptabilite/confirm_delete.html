{% extends 'base.html' %}
{% block title %}Confirmation suppression{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="card border-0 shadow-sm mx-auto" style="max-width:500px;">
    <div class="card-body text-center py-5">
      <h5 class="text-danger">🗑️ Confirmer la suppression</h5>
      <p class="mt-3">Voulez-vous vraiment supprimer <strong>{{ object }}</strong> ?</p>
      <form method="post">{% csrf_token %}
        <div class="d-flex gap-2 justify-content-center mt-4">
          <button type="submit" class="btn btn-danger">Oui, supprimer</button>
          <a href="javascript:history.back()" class="btn btn-outline-secondary">Annuler</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
