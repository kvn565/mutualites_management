{% load static %}
<!DOCTYPE html>
<html lang="fr" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Connexion — {{ APP_NOM }}{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- AdminLTE 4 -->
    <link href="{% static 'vendor/adminlte/css/adminlte.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/bootstrap-icons/css/bootstrap-icons.min.css' %}" rel="stylesheet">

    <style>
        :root {
            --vert: {{ APP_PRIMARY_COLOR|default:'#0a5c36' }};
            --vert-clair: {{ APP_ACCENT_COLOR|default:'#c9a84c' }};
            --vert-fonce: {{ APP_BACKGROUND_COLOR|default:'#062c1a' }};
            --or: {{ APP_ACCENT_COLOR|default:'#c9a84c' }};
            --text-color: {{ APP_TEXT_COLOR|default:'#1e293b' }};
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            {% if APP_BACKGROUND_IMAGE_URL %}
            background: url('{{ APP_BACKGROUND_IMAGE_URL }}') center/cover fixed;
            {% else %}
            background: linear-gradient(135deg, #062c1a 0%, #0a5c36 50%, #0d7a48 100%);
            {% endif %}
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-color);
        }
        h1, h2, h3, .login-logo, .brand-text {
            font-family: 'Outfit', sans-serif;
        }
        .login-box {
            width: 100%;
            max-width: 500px;
        }
        .login-box-wide {
            max-width: 720px;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 24px;
            color: #fff;
            font-size: 1.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }
        .login-logo .logo-icon {
            width: 58px; height: 58px;
            background: rgba(255,255,255,0.12);
            border: 2px solid rgba(201,168,76,0.35);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--or);
            position: relative;
        }
        .login-logo .logo-icon .cross-badge {
            position: absolute;
            bottom: -4px; right: -4px;
            width: 20px; height: 20px;
            background: var(--or);
            color: var(--vert-fonce);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 700;
            border: 2px solid var(--vert-fonce);
        }
        .login-logo .logo-text {
            color: #fff;
        }
        .login-logo .logo-sub {
            font-size: 0.72rem;
            font-weight: 400;
            opacity: 0.6;
            display: block;
        }
        .card {
            border-radius: 16px;
            border: none;
            border-top: 4px solid var(--or);
            box-shadow: 0 24px 60px rgba(0,0,0,0.3);
        }
        .login-card-body {
            padding: 40px 38px;
        }
        .login-box-msg {
            font-size: 1.1rem;
            color: #374151;
            margin-bottom: 24px;
            text-align: center;
            font-weight: 500;
        }
        .form-control {
            height: 50px;
            border: 2px solid #d1d5db;
            border-radius: 11px;
            font-size: 0.95rem;
            padding-left: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            border-color: var(--vert);
            box-shadow: 0 0 0 4px rgba(10,92,54,0.12);
        }
        .input-group .input-group-text {
            border: 2px solid #d1d5db;
            border-radius: 0 11px 11px 0;
            background: #f9fafb;
            color: #9ca3af;
        }
        .input-group .input-group-text i {
            font-size: 1.15rem;
        }
        .input-group:focus-within .input-group-text {
            border-color: var(--vert);
        }
        .btn-login {
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, var(--vert), var(--vert-clair));
            border: none;
            border-radius: 11px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            transition: all 0.25s;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, var(--vert-clair), #10a060);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(10,92,54,0.35);
        }
        .auth-footer {
            text-align: center;
            margin-top: 20px;
        }
        .auth-footer a {
            color: var(--vert);
            text-decoration: none;
            font-weight: 500;
        }
        .auth-footer a:hover { text-decoration: underline; }
        .auth-footer .secure-badge {
            display: block;
            margin-top: 16px;
            font-size: 0.8rem;
            color: #9ca3af;
        }
        .error-msg {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.9rem;
            color: #991b1b;
            margin-bottom: 20px;
        }
        .field-error {
            font-size: 0.82rem;
            color: #dc2626;
            margin-top: 5px;
        }
        .medical-cross {
            position: relative;
            width: 24px; height: 24px;
        }
        .medical-cross::before,
        .medical-cross::after {
            content: '';
            position: absolute;
            background: #fff;
            border-radius: 3px;
        }
        .medical-cross::before {
            width: 24px; height: 8px;
            top: 8px; left: 0;
        }
        .medical-cross::after {
            width: 8px; height: 24px;
            top: 0; left: 8px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="login-page">
    {% block auth_body %}{% endblock %}

    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
