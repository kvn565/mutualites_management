{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Hôpital — Connexion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="{% static 'vendor/bootstrap-icons/css/bootstrap-icons.min.css' %}" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            {% if APP_BACKGROUND_IMAGE_URL %}
            background: linear-gradient(rgba(6,44,26,0.65) 0%, rgba(10,92,54,0.45) 100%), url('{{ APP_BACKGROUND_IMAGE_URL }}') center/cover fixed;
            {% else %}
            background: linear-gradient(135deg, #0a5c36 0%, #062c1a 100%);
            {% endif %}
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
        }
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-icon {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #0a5c36, #0d7a48);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 2rem;
            color: #fff;
        }
        .login-header h1 { font-size: 1.4rem; font-weight: 700; color: #0f172a; }
        .login-header p { font-size: 0.85rem; color: #64748b; margin-top: 4px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #dde3ea;
            border-radius: 10px;
            font-size: 0.9rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            border-color: #0a5c36;
            box-shadow: 0 0 0 3px rgba(10,92,54,0.12);
            outline: none;
        }
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 44px;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            font-size: 1.2rem;
            padding: 4px;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }
        .toggle-password:hover { color: #0a5c36; }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #0a5c36;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: #0d7a48; }
        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }
        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }
        .alert-success {
            background: #e8f8f0;
            color: #166534;
            border-left: 4px solid #10b981;
        }
        .alert-warning {
            background: #fffbeb;
            color: #92400e;
            border-left: 4px solid #f59e0b;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon"><i class="bi bi-hospital"></i></div>
            <h1>Portail Partenaire</h1>
            <p>Connectez-vous pour accéder à votre espace</p>
        </div>

        {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{ msg.tags }}">{{ msg }}</div>
        {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Nom d'utilisateur</label>
                {{ form.username }}
            </div>
            <div class="form-group">
                <label for="id_password">Mot de passe</label>
                <div class="password-wrapper">
                    {{ form.password }}
                    <button type="button" class="toggle-password" onclick="togglePassword()" id="toggleBtn" aria-label="Afficher/masquer le mot de passe">
                        <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-submit">
                <i class="bi bi-box-arrow-in-right"></i> Se connecter
            </button>
        </form>
        <div style="text-align:center;margin-top:20px;font-size:0.85rem;color:#64748b;">
            Pas encore de compte ?
            <a href="{% url 'portail_partenaire:inscription' %}" style="color:#0a5c36;font-weight:600;text-decoration:none;">Créer un compte</a>
        </div>
    </div>
    <script>
        function togglePassword() {
            const input = document.getElementById('id_password');
            const icon = document.getElementById('toggleIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }
    </script>
</body>
</html>
